# SHAPER — MovieLens-100K VERIFICATION/TEST configuration.
#
# ml-100k is NOT part of the registered study (the locked datasets are
# ML-1M and Beauty, spec A.3/A.15). It exists to exercise the complete
# pipeline end-to-end on a small real dataset, with a deliberately reduced
# model/budget (d=32, FFN=64, short step grid) so the full sweep completes
# quickly on CPU. Scientific protocol locks in ml1m.yaml/beauty.yaml are
# untouched; nothing here feeds a confirmatory table.
dataset:
  name: ml100k
  source: "GroupLens ml-100k.zip (u.data) — VERIFICATION/TEST only"
  implicit_rating_threshold: 4      # rating >= 4 positive (same convention as ML-1M)
  core: 5
  core_order: row_order
  max_len: 50
  batch_size: 128
  seed: 20260813
  verification_only: true
  k4_mc_allowed: true               # K=4 MC machinery is registered for Beauty;
                                    # allowed here purely to exercise the code path
  expected_raw_zip_sha1: "cd4dcac4241c8a4ad7badc7ca635da8a69dddb83"  # published GroupLens checksum

model:
  d: 32                            # reduced vs the registered d=64 (verification only)
  heads: 2
  blocks: 2
  ff: 64
  dropout: 0.2
  projection: [32, 32, 32]
  embed_vocab_offset: 2

augmentation:
  min_contrastive_pairs: 8
  crop: {eta_low: 0.5, eta_high: 1.0, min_keep: 2, force_nonidentity: true}
  mask: {gamma: 0.2, protect_last: false}
  reorder: {beta: 0.2, min_span: 2, max_attempts: 10}
  dropout: {p: 0.2, extra_forwards: 2}

training:
  optimizer: adamw
  betas: [0.9, 0.98]
  eps: 1.0e-8
  weight_decay: 1.0e-4
  grad_clip: 1.0
  warmup_frac: 0.10
  cosine_final_frac: 0.1
  lr: null
  steps: null
  lambda_cl: null
  tau: null
  checkpoint_interval: 8

evaluation:
  k: 10
  secondary_ks: [5, 10]
  tie_break: item_id_ascending
  prefix_filter: true
  retain_repeated_target: true

roles:
  tune: 0.20
  game: 0.60
  select: 0.20

cost_estimate:
  minutes_per_coalition: [0.2, 1.0]
  peak_gpu_memory_target_gb: 2

# Verification-only seed set (NOT the registered registry in seeds.yaml).
# 1 confirmatory seed keeps the full sweep fast while still exercising every
# stage; two pilots keep the pilot-informed archive gate in its exact shape.
test_seeds:
  recipe_alpha: [901, 902, 903]
  pilots: [1001, 1002]
  engineering: 1001
  confirmatory_game_a: [2001]
  extension_game_a: []
  game_b: [2001]
  cosine_diagnostic: [2001]
  k4_beauty_mc: [3001]
  nondeterminism_floor_repeat_seed: 2001

# Verification-only shrunk grids (applied by the scripts for this dataset).
recipe_override:
  learning_rates: [1.0e-3]
  step1_steps: 12
  step_grid: [8, 16]
  lambda_grid: [0.1]
  tau_grid: [0.1]
  singleton_lambda_stress: [0.1]
interventions_override:
  alpha_grid: [0.0, 0.5, 1.0]
  gate_entropy_coefficients: [0.0, 0.1]
segments_override:
  permutations: 2000
