# SHAPER — Amazon Reviews 2018 Beauty (5-core) protocol configuration (locked).
dataset:
  name: beauty
  source: "Amazon Reviews 2018 Beauty 5-core (http://deepyeti.ucsd.edu/jianmo/amazon)"
  implicit_rating_threshold: null   # every retained review is positive
  core: 5
  core_order: row_order             # deterministic processing order
  max_len: 50
  batch_size: 256
  seed: 20260813
  raw_file: Beauty_5.json.gz

model:
  d: 64
  heads: 2
  blocks: 2
  ff: 256
  dropout: 0.2
  projection: [64, 64, 64]
  embed_vocab_offset: 2

augmentation:
  min_contrastive_pairs: 8
  crop:
    eta_low: 0.5
    eta_high: 1.0
    min_keep: 2
    force_nonidentity: true
  mask:
    gamma: 0.2
    protect_last: false
  reorder:
    beta: 0.2
    min_span: 2
    max_attempts: 10
  dropout:
    p: 0.2
    extra_forwards: 2

training:
  optimizer: adamw
  betas: [0.9, 0.98]
  eps: 1.0e-8
  weight_decay: 1.0e-4
  grad_clip: 1.0
  warmup_frac: 0.10
  cosine_final_frac: 0.1
  lr: null
  steps: null
  lambda_cl: null
  tau: null
  checkpoint_interval: 500

evaluation:
  k: 10
  secondary_ks: [5, 20]
  tie_break: item_id_ascending
  prefix_filter: true
  retain_repeated_target: true

roles:
  tune: 0.20
  game: 0.60
  select: 0.20

cost_estimate:
  minutes_per_coalition: [8, 15]
  peak_gpu_memory_target_gb: 8
